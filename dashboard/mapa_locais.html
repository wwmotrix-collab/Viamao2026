<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viamão 2026 — Mapa de Locais</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#0b1220;--panel:rgba(15,23,42,.94);--border:rgba(148,163,184,.25);--text:#ebf2ff;--muted:#a9b9d1}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}body{display:flex;flex-direction:column;overflow:hidden}.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:linear-gradient(135deg,#0f172a,#1d2f4d);border-bottom:1px solid var(--border);z-index:2}.brand{display:flex;gap:12px;align-items:center}.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#1a4ea3,#bc3d2d);display:grid;place-items:center;font-weight:bold;font-size:20px}.brand-title{font-weight:bold}.brand-sub{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em}.map-wrap{position:relative;flex:1;min-height:0}#map{position:absolute;inset:0}.legend{position:absolute;z-index:500;left:16px;top:16px;width:min(310px,calc(100% - 32px));padding:14px;border:1px solid var(--border);border-radius:16px;background:var(--panel);box-shadow:0 18px 32px #02061780}.legend h2{margin:0 0 10px;color:var(--muted);font-size:.9rem;text-transform:uppercase;letter-spacing:.08em}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:#0f172ab3}.stat-label{display:block;color:var(--muted);font-size:.68rem}.stat-value{font-size:1.15rem;font-weight:bold}.missing{margin-top:10px;color:#ffd166;font-size:.75rem;max-height:130px;overflow:auto}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#112033;color:var(--text)}.leaflet-popup-content{min-width:220px;max-width:calc(100vw - 48px);line-height:1.5}.popup-title{font-weight:bold}.popup-meta{color:var(--muted);font-size:.78rem}.popup-row{display:flex;justify-content:space-between;border-top:1px solid #94a3b833;margin-top:7px;padding-top:5px}@media(max-width:560px){.topbar{padding:10px 12px}.status{display:none}.legend{left:8px;top:8px;width:calc(100% - 16px);padding:10px}.stat{padding:8px}.stat-value{font-size:1rem}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="brand-mark">V</div><div><div class="brand-title">Viamão 2026</div><div class="brand-sub">Locais de votação</div></div></div><div class="status">dados ativos</div></header>
<div class="map-wrap"><div id="map"></div><aside class="legend"><h2>Resumo do mapa</h2><div class="stats"><div class="stat"><span class="stat-label">Locais cadastrados</span><span class="stat-value" id="total-locais">0</span></div><div class="stat"><span class="stat-label">No mapa</span><span class="stat-value" id="total-marcadores">0</span></div><div class="stat"><span class="stat-label">Seções</span><span class="stat-value" id="total-secoes">0</span></div><div class="stat"><span class="stat-label">Votos</span><span class="stat-value" id="total-votos">0</span></div></div><div id="missing" class="missing"></div></aside></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const VIAMAO=[-30.084,-51.023];
const map=L.map('map',{minZoom:10,maxZoom:19}).setView(VIAMAO,12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const el=id=>document.getElementById(id);
async function carregar(){for(const url of ['/data/processed/locais_normalized.json','../data/processed/locais_normalized.json']){try{const r=await fetch(url,{cache:'no-store'});if(r.ok){const d=await r.json();if(Array.isArray(d.locais))return d.locais}}catch(e){}}return[]}
function cor(l){const d=Number(l.agregado?.votos_denise||0),h=Number(l.agregado?.votos_helenir||0);return d===h?'#ff9f43':d>h?'#2a7de1':'#2fcf74'}
function raio(l){return Math.max(7,Math.min(28,7+Math.sqrt(Number(l.agregado?.total_votos||0))*2.8))}
function popup(l){const a=l.agregado||{};return `<div class="popup-title">${l.nome||'Local'}</div><div class="popup-meta">${l.endereco||'Endereço não informado'}</div><div class="popup-meta">${l.bairro||'N/A'} · Zona ${l.zona_eleitoral||'N/A'}</div><div class="popup-meta">Seções (${(l.secoes||[]).length}): ${(l.secoes||[]).join(', ')||'N/A'}</div><div class="popup-row"><span>Eleitores</span><strong>${l.eleitores==null?'Não informado':Number(l.eleitores).toLocaleString('pt-BR')}</strong></div><div class="popup-row"><span>Denise</span><strong>${a.votos_denise||0}</strong></div><div class="popup-row"><span>Helenir</span><strong>${a.votos_helenir||0}</strong></div><div class="popup-row"><span>Total votos</span><strong>${a.total_votos||0}</strong></div>`}
(async()=>{const locais=await carregar();const validos=locais.filter(l=>l.coordenadas&&Number.isFinite(Number(l.coordenadas.latitude))&&Number.isFinite(Number(l.coordenadas.longitude)));el('total-locais').textContent=locais.length;el('total-marcadores').textContent=validos.length;el('total-secoes').textContent=locais.reduce((n,l)=>n+(l.secoes||[]).length,0);el('total-votos').textContent=locais.reduce((n,l)=>n+Number(l.agregado?.total_votos||0),0);const faltantes=locais.filter(l=>!validos.includes(l));el('missing').textContent=faltantes.length?`${faltantes.length} local(is) sem coordenadas e não plotado(s): ${faltantes.map(l=>l.nome).join(', ')}`:'';const layer=L.layerGroup().addTo(map);validos.forEach(l=>{const c=l.coordenadas;L.circleMarker([Number(c.latitude),Number(c.longitude)],{radius:raio(l),color:cor(l),fillColor:cor(l),fillOpacity:.8,weight:1.3}).bindPopup(popup(l)).addTo(layer)});map.setView(VIAMAO,12);map.setZoom(12)})();
</script>
</body>
</html>
