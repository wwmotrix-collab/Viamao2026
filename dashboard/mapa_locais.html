<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Viamão 2026 — Mapa de Locais</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{--bg:#0b1220;--panel:rgba(15,23,42,.92);--border:rgba(148,163,184,.25);--text:#ebf2ff;--muted:#a9b9d1;--green:#2fcf74;--shadow:rgba(2,6,23,.5)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}body{display:flex;flex-direction:column;overflow:hidden}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:linear-gradient(135deg,#0f172a,#1d2f4d);border-bottom:1px solid var(--border);z-index:1000}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand-mark{width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:linear-gradient(135deg,#1a4ea3,#bc3d2d);display:grid;place-items:center;font-weight:700;font-size:20px}.brand-title{font-size:1.05rem;font-weight:700;letter-spacing:.04em}.brand-sub{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em}.status{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:999px;border:1px solid var(--border);font-size:.8rem;color:var(--muted)}.dot{width:10px;height:10px;border-radius:50%;background:var(--green)}.map-wrap{position:relative;flex:1;min-height:0}#map{position:absolute;inset:0}.legend{position:absolute;left:16px;top:16px;z-index:500;width:min(300px,calc(100% - 32px));background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:16px;box-shadow:0 18px 32px var(--shadow);padding:12px 14px}.legend h2{margin:0 0 10px;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{min-width:0;background:rgba(15,23,42,.7);border:1px solid var(--border);border-radius:12px;padding:10px 12px}.stat-label{display:block;color:var(--muted);font-size:.68rem;margin-bottom:2px}.stat-value{font-size:1.15rem;font-weight:700}.legend-list{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}.chip{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:6px 10px}.chip i{display:inline-block;width:10px;height:10px;border-radius:50%}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#112033;color:var(--text)}.leaflet-popup-content{margin:12px 14px;line-height:1.5;min-width:min(230px,70vw);max-width:calc(100vw - 48px)}.popup-title{font-weight:700;font-size:1rem;margin-bottom:6px;overflow-wrap:anywhere}.popup-meta{color:var(--muted);font-size:.78rem;overflow-wrap:anywhere}.popup-row{display:flex;justify-content:space-between;gap:12px;padding-top:6px;border-top:1px solid rgba(148,163,184,.2);margin-top:8px}.missing{margin-top:10px;color:#ffd166;font-size:.75rem}
@media(max-width:560px){.topbar{padding:10px 12px}.brand-title{font-size:.95rem}.brand-sub{font-size:.62rem}.status{display:none}.legend{left:8px;top:8px;width:calc(100% - 16px);padding:10px;border-radius:12px}.stats{gap:6px}.stat{padding:8px 10px}.stat-value{font-size:1rem}.legend-list{margin-top:8px;gap:5px}.chip{padding:5px 8px}.leaflet-popup-content{min-width:0;font-size:.9rem}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="brand-mark">V</div><div><div class="brand-title">Viamão 2026</div><div class="brand-sub">Locais de votação</div></div></div><div class="status"><span class="dot"></span><span>dados ativos</span></div></header>
<div class="map-wrap"><div id="map" aria-label="Mapa de locais de votação de Viamão"></div><aside class="legend"><h2>Resumo do mapa</h2><div class="stats"><div class="stat"><span class="stat-label">Locais</span><span class="stat-value" id="total-locais">0</span></div><div class="stat"><span class="stat-label">Seções</span><span class="stat-value" id="total-secoes">0</span></div><div class="stat"><span class="stat-label">Denise</span><span class="stat-value" id="total-denise">0</span></div><div class="stat"><span class="stat-label">Helenir</span><span class="stat-value" id="total-helenir">0</span></div></div><div class="legend-list"><span class="chip"><i style="background:#2a7de1"></i> Denise</span><span class="chip"><i style="background:#2fcf74"></i> Helenir</span><span class="chip"><i style="background:#ff9f43"></i> empate</span></div><div id="missing" class="missing"></div></aside></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([-30.084,-51.023],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const $=id=>document.getElementById(id);
async function carregar(){for(const url of ['/data/processed/locais_normalized.json','../data/processed/locais_normalized.json']){try{const r=await fetch(url,{cache:'no-store'});if(r.ok){const d=await r.json();if(Array.isArray(d.locais))return d.locais}}catch(e){}}return[]}
function popup(local){const a=local.agregado||{};const eleitores=local.eleitores==null?'Não informado':Number(local.eleitores).toLocaleString('pt-BR');return `<div class="popup-title">${local.nome||'Local'}</div><div class="popup-meta">Bairro: ${local.bairro||'N/A'}</div><div class="popup-meta">Zona: ${local.zona_eleitoral||'N/A'}</div><div class="popup-meta">Endereço: ${local.endereco||'N/A'}</div><div class="popup-meta">Seções (${(local.secoes||[]).length}): ${(local.secoes||[]).join(', ')||'N/A'}</div><div class="popup-row"><span>Eleitores</span><strong>${eleitores}</strong></div><div class="popup-row"><span>Denise</span><strong>${a.votos_denise||0}</strong></div><div class="popup-row"><span>Helenir</span><strong>${a.votos_helenir||0}</strong></div><div class="popup-row"><span>Total votos</span><strong>${a.total_votos||0}</strong></div>`}
function radius(local){const total=Number(local.agregado?.total_votos||0);return Math.max(7,Math.min(28,7+Math.sqrt(total)*2.8))}function color(local){const d=Number(local.agregado?.votos_denise||0),h=Number(local.agregado?.votos_helenir||0);return d===h?'#ff9f43':d>h?'#2a7de1':'#2fcf74'}
(async()=>{const locais=await carregar();$('total-locais').textContent=locais.length;const totalSecoes=locais.reduce((n,l)=>n+(l.secoes||[]).length,0);$('total-secoes').textContent=totalSecoes;$('total-denise').textContent=locais.reduce((n,l)=>n+Number(l.agregado?.votos_denise||0),0);$('total-helenir').textContent=locais.reduce((n,l)=>n+Number(l.agregado?.votos_helenir||0),0);const validos=locais.filter(l=>l.coordenadas&&Number.isFinite(Number(l.coordenadas.latitude))&&Number.isFinite(Number(l.coordenadas.longitude)));$('missing').textContent=locais.length-validos.length?`${locais.length-validos.length} local(is) sem coordenadas: dados aparecem no painel, mas não podem ser plotados.`:'';const layer=L.layerGroup().addTo(map);validos.forEach(local=>{const p=local.coordenadas;L.circleMarker([Number(p.latitude),Number(p.longitude)],{radius:radius(local),color:color(local),fillColor:color(local),fillOpacity:.78,weight:1.4}).bindPopup(popup(local)).addTo(layer)});if(validos.length)map.fitBounds(L.latLngBounds(validos.map(l=>[Number(l.coordenadas.latitude),Number(l.coordenadas.longitude)])).pad(.25))})()
</script></body></html>
